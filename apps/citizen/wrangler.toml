#:schema node_modules/wrangler/config-schema.json

name = "als-citizen-dept"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Public demo domain (auto-provisions DNS + cert on the datadowns.com zone).
routes = [
  { pattern = "agenticgov.datadowns.com", custom_domain = true }
]

# Secrets (set with `wrangler secret put <NAME> --name als-citizen-dept`):
#   ANTHROPIC_API_KEY — the per-project Anthropic key (the cohort runs on Sonnet)
#   DEMO_PASSWORD     — the shared password gating the hosted demo

[vars]
STUDIO_API_URL = "https://als-studio.chris-8ab.workers.dev"

[[services]]
binding = "STUDIO"
service = "als-studio"

[[d1_databases]]
binding = "DB"
database_name = "als-evidence"
database_id = "41c89a7c-c2d9-457e-b3ae-506046e8645c"
migrations_dir = "migrations/evidence"

[[d1_databases]]
binding = "PERSONAL_DATA_DB"
database_name = "als-personal-data"
database_id = "388e720a-358d-4129-8156-692f83fdb4ea"
migrations_dir = "migrations/personal-data"
